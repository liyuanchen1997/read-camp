server:
  port: 8080

spring:
  application:
    name: readcamp-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/readcamp?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

readcamp:
  jwt:
    secret: ${JWT_SECRET:}
    expire-days: 7
  ai:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-v4-flash
    batch-size: 5
    timeout-seconds: 120

logging:
  level:
    com.readcamp: info
